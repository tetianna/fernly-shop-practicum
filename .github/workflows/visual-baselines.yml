name: Visual baselines

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why these baselines are being regenerated
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: visual-baselines-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Update visual snapshots
        env:
          CI: true
        run: npx playwright test --project=visual --update-snapshots=all

      - name: Commit baselines on new branch
        env:
          REASON: ${{ inputs.reason }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ -z "$(git status --porcelain tests/visual)" ]; then
            echo "No changes under tests/visual; nothing to commit."
            echo "No snapshot updates were produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          NEW_BRANCH="visual-baselines/${RUN_ID}"
          git checkout -b "$NEW_BRANCH"
          git add tests/visual
          git commit -m "Visual baselines: ${REASON}"
          git push origin "$NEW_BRANCH"

          {
            echo "## Visual baselines"
            echo ""
            echo "Source branch: \`${SOURCE_BRANCH}\`"
            echo "New branch: \`${NEW_BRANCH}\`"
            echo ""
            echo "Open a pull request from the compare link:"
            echo "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${SOURCE_BRANCH}...${NEW_BRANCH}"
          } >> "$GITHUB_STEP_SUMMARY"
